# XcodeGen spec for the Resonance iOS app (App/ + App/AppIntents/).
# Generate with:  cd ios && xcodegen generate  (Resonance.xcodeproj is not committed)
name: Resonance
options:
  bundleIdPrefix: com.cknowlesbadluck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Release builds read the control-plane URL from Info.plist (RESONANCE_BASE_URL).
    # Leave empty for DEBUG (localhost default) or pass on the command line:
    #   xcodebuild ... RESONANCE_BASE_URL=https://your-nexus.example
    RESONANCE_BASE_URL: ""

targets:
  # ResonanceCore is built from the same sources as the SwiftPM library (ios/Package.swift)
  # so `import ResonanceCore` works unchanged in the app and its intents.
  ResonanceCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ResonanceCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.cknowlesbadluck.resonance.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  Resonance:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
          - Info.plist
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ResonanceCore
        embed: true
      - sdk: AppIntents.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Resonance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        RESONANCE_BASE_URL: $(RESONANCE_BASE_URL)
    settings:
      base:
        # App/ still uses Swift 5 language mode (AppIntent static metadata is `static var`).
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        PRODUCT_BUNDLE_IDENTIFIER: com.cknowlesbadluck.resonance
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ResonanceCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ResonanceCoreTests
    dependencies:
      - target: ResonanceCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.cknowlesbadluck.resonance.core.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Resonance:
    build:
      targets:
        Resonance: all
        ResonanceCore: all
    test:
      targets:
        - ResonanceCoreTests
      gatherCoverageData: false
