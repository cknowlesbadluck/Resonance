name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: Base URL for production smoke (host-neutral)
        required: false
        default: "https://resonancenexus.netlify.app"

permissions:
  contents: read

concurrency:
  group: resonance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_VERTICAL_SLICE: "1"
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-vertical-slice-evidence
          path: artifacts/github-vertical-slice.json
          if-no-files-found: error
      - run: npm run build

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test ResonanceCore
        run: swift test --package-path ios

  CI:
    if: always()
    needs: [web, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require web and ios
        run: |
          echo "web=${{ needs.web.result }}"
          echo "ios=${{ needs.ios.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.ios.result }}" = "success"

  production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.smoke_url }}
