name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: Base URL for production smoke (host-neutral)
        required: false
        default: "https://resonancenexus.netlify.app"

permissions:
  contents: read

concurrency:
  group: resonance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_VERTICAL_SLICE: "1"
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-vertical-slice-evidence
          path: artifacts/github-vertical-slice.json
          if-no-files-found: warn
      - run: npm run build
      # Advisory only: current findings are postcss transitively via next, and
      # clearing them needs a next@16 major upgrade. Surfaced, not gating.
      - name: Dependency advisories (non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test ResonanceCore
        run: swift test --package-path ios

  CI:
    if: always()
    needs: [web, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require web and ios
        run: |
          echo "web=${{ needs.web.result }}"
          echo "ios=${{ needs.ios.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.ios.result }}" = "success"

  production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.smoke_url }}
      # Report-only: compares live /api/ready fields to main's contract (no secrets).
      - name: Deploy parity (report-only)
        run: node scripts/deploy-parity.mjs "${SMOKE_BASE_URL%/}/api/ready"
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.smoke_url }}
