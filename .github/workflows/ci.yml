name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: Base URL for production smoke (host-neutral)
        required: false
        default: "https://resonancenexus.netlify.app"

permissions:
  contents: read

concurrency:
  group: resonance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_VERTICAL_SLICE: "1"
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-vertical-slice-evidence
          path: artifacts/github-vertical-slice.json
          if-no-files-found: warn
      - run: npm run build
      # Advisory only: current findings are postcss transitively via next, and
      # clearing them needs a next@16 major upgrade. Surfaced, not gating.
      - name: Dependency advisories (non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test ResonanceCore
        run: swift test --package-path ios

  ios-app:
    name: ios-app (XcodeGen build + simulator tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Resonance.xcodeproj
        working-directory: ios
        run: xcodegen generate
      - name: Build app (App + AppIntents) for iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project Resonance.xcodeproj -scheme Resonance \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build app (Release, device SDK, unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project Resonance.xcodeproj -scheme Resonance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run ResonanceCore tests on an iPhone simulator
        working-directory: ios
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Using simulator $UDID"
          xcodebuild -project Resonance.xcodeproj -scheme Resonance \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test

  CI:
    if: always()
    needs: [web, ios, ios-app]
    runs-on: ubuntu-latest
    steps:
      - name: Require web, ios and ios-app
        run: |
          echo "web=${{ needs.web.result }}"
          echo "ios=${{ needs.ios.result }}"
          echo "ios-app=${{ needs.ios-app.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.ios.result }}" = "success"
          test "${{ needs.ios-app.result }}" = "success"

  production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.smoke_url }}
