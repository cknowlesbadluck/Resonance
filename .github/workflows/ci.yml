name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ResonanceCore
        run: swift test --package-path ios
