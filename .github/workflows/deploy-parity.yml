name: Deploy parity (report-only)

# Read-only: GETs the public /api/ready and the public GitHub main SHA.
# Report-only: never fails, never writes, needs no secrets. Free on public repos.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Compare live commitSha with main
        run: |
          set +e
          out=$(node scripts/deploy-parity.mjs https://resonancenexus.netlify.app "${{ github.repository }}" 2>&1)
          code=$?
          echo "$out"
          {
            echo "### Deploy parity (exit $code: 0=match, 1=drift/missing, 2=probe error)"
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::warning title=Deploy parity::live deploy does not match main (exit $code)"; fi
          exit 0
