name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/production-phase-testing
    paths:
      - 'ios/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve and test Swift package
        working-directory: ios
        run: swift test

      - name: Archive iOS app for device
        working-directory: ios
        run: |
          xcodebuild \
            -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Resonance.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      # SideStore performs the final on-device signing/install step. The IPA
      # produced here intentionally contains a valid iOS app bundle without
      # requiring Resonance to possess the user's Apple signing credentials.
      - name: Package SideStore IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Resonance.xcarchive/Products/Applications/Resonance.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Resonance-SideStore.ipa Payload

      - name: Validate SideStore IPA
        run: |
          unzip -l "$RUNNER_TEMP/Resonance-SideStore.ipa"
          test -f "$RUNNER_TEMP/Resonance-SideStore.ipa"
          test -d "$RUNNER_TEMP/Resonance.xcarchive/Products/Applications/Resonance.app"
          shasum -a 256 "$RUNNER_TEMP/Resonance-SideStore.ipa" | tee "$RUNNER_TEMP/Resonance-SideStore.ipa.sha256"

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ios-sidestore-ipa
          path: |
            ${{ runner.temp }}/Resonance-SideStore.ipa
            ${{ runner.temp }}/Resonance-SideStore.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ios-xcarchive
          path: ${{ runner.temp }}/Resonance.xcarchive
          if-no-files-found: error
          retention-days: 14
